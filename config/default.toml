# default configuration, override in config/local-development.toml

# port to listen on
port = 8800

# whether the app runs behind a trusted proxy
proxy = false

# application name used for logging and service namespace
name = 'imagehoster'

# number of worker processes to spawn, 0 = autodetect
num_workers = 1

# libvips threads per worker process, 0 = sharp's default (one per cpu core)
vips_concurrency = 4

# bounds on keeping the animation of a GIF or WebP with more than one frame
# when it is resized; beyond them the first frame is resized, as for a static
# image, and the stored result is marked with a '<key>.animated-fallback' object
# max frames in the source
animated_max_frames = 100
# max frames x width x height of the source
animated_max_pixels = 50000000
# seconds the animated pipeline may take, 1-3600
animated_timeout_s = 10
# cgif effort of animated GIF output, 1 (fastest) to 10
animated_gif_effort = 2

# with more than one worker, a worker whose resident plus swapped memory exceeds
# this many MB is replaced: a new worker is started and, once it listens, the old
# one is stopped gracefully. 0 disables the memory check
worker_max_rss_mb = 4096
# how often the master samples worker memory, in ms
worker_rss_check_interval_ms = 30000
# how long a worker asked to stop may take before it is killed, in ms
worker_stop_timeout_ms = 30000

# url to hived node used for verifying signatures
rpc_node = 'https://api.hive.blog'

# url where service is running
service_url = 'http://localhost:8800'

# default user avatar, should be a png minimum 512x512
default_avatar = 'https://images.hive.blog/DQmb2HNSGKN3pakguJ4ChCRjgkVuDN9WniFRPmrxoJ4sjR4'
# default user cover, should be a png minimum 1344x240
default_cover = 'https://images.ecency.com/DQmdA9wjRyGmDwrTza59yLSjCWMEc9sFD5sC4ZU5kL9UMqo/cover_fallback_day.png'

# log level to output at
log_level = 'debug'

# where to write logs, can be file path or stdout/err
log_output = 'stdout'

# max image size to allow uploading and proxying, in bytes
max_image_size = 15000000 # 15mb

# redis db used for ratelimiting uploads
# redis_url = 'redis://localhost'

# upload rate and reputation limits, rate limits only enforced if redis db is configured
[upload_limits]
duration = 604800000 # in ms (=1 week)
max = 300 # max requests within duration
reputation = 10 # minimum reputation needed for upload
app_account = 'hive.blog'

# Enable 2-character directory partitioning for stored images.
# When true, images are stored under XX/hash instead of flat hash.
# WARNING: changing this on an existing deployment will make existing
# images inaccessible unless files are migrated into subdirectories.
# storage_partitioning = false

# blob stores, valid types are: memory, s3
# the s3 type additionally needs the s3_bucket key to be set and expects
# the proper AWS credentials to be configured (see aws-sdk for more info)

# where to keep uploaded images
[upload_store]
type = 'memory'

# proxy whitelist: only serve proxy URLs referenced on the Hive blockchain
[whitelist]
enabled = false
# apiUrl = 'http://localhost:7015'  # PostgREST API for whitelist checks


# domain allowlist: bypass whitelist check for URLs on these domains
# (YouTube thumbnail CDNs are hardcoded; this file adds extras)
[allowlist]
# domainAllowList = 'allowlist.json'

# where to keep proxied images
[proxy_store]
type = 'memory'
max_image_width = 1280
max_image_height = 8000
max_custom_image_width = 8000
max_custom_image_height = 8000
